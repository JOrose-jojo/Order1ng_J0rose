<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>煎饼侠 - 点餐</title>
    <style>
        /* ===== 全局样式 ===== */
        :root {
            --primary: #FF7E36;
            --primary-dark: #E6621F;
            --bg: #F7F7F7;
            --card: #FFFFFF;
            --text: #333333;
            --text-light: #888888;
            --border: #EEEEEE;
            --danger: #FF5252;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text); max-width: 500px; margin: 0 auto;
            min-height: 100vh; padding-bottom: calc(70px + var(--safe-bottom)); -webkit-font-smoothing: antialiased;
        }
        /* 导航栏 */
        .navbar {
            position: sticky; top: 0; z-index: 100; background: var(--primary); color: white;
            padding: 15px 16px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 8px rgba(255,126,54,0.3);
        }
        .navbar .brand { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .navbar .brand .emoji { font-size: 24px; }
        .nav-btn {
            background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 16px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .nav-btn.active { background: white; color: var(--primary); }
        /* 分类 */
        .category-bar {
            display: flex; overflow-x: auto; padding: 12px 12px 8px; gap: 8px; background: var(--bg);
            position: sticky; top: 60px; z-index: 90;
        }
        .category-bar::-webkit-scrollbar { display: none; }
        .category-btn {
            flex: 0 0 auto; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
            background: white; color: var(--text-light); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .category-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 2px 6px rgba(255,126,54,0.3); }
        /* 菜单列表 */
        .menu-list { padding: 8px 12px 20px; display: flex; flex-direction: column; gap: 10px; }
        .menu-item {
            background: var(--card); border-radius: var(--radius); padding: 14px; display: flex; align-items: center;
            gap: 12px; box-shadow: var(--shadow); animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .menu-item .item-emoji { font-size: 40px; width: 52px; height: 52px; background: #FFF5EC; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .menu-item .item-info { flex: 1; min-width: 0; }
        .menu-item .item-name { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
        .menu-item .item-desc { font-size: 12px; color: var(--text-light); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .menu-item .item-price { font-size: 16px; font-weight: 700; color: var(--primary); }
        .menu-item .item-price::before { content: '¥'; font-size: 12px; margin-right: 2px; }
        .quantity-control { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .quantity-btn { width: 30px; height: 30px; border-radius: 50%; border: none; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
        .quantity-btn.minus { background: #FFF0EA; color: var(--primary); border: 1px solid #FFD0B8; }
        .quantity-btn.plus { background: var(--primary); color: white; border: 1px solid var(--primary); }
        .quantity-btn:active { transform: scale(0.9); }
        .quantity-num { font-size: 15px; font-weight: 600; min-width: 20px; text-align: center; }
        /* 底部购物车栏 */
        .cart-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px;
            background: #2C2C2C; color: white; padding: 10px 16px; padding-bottom: calc(10px + var(--safe-bottom));
            display: flex; align-items: center; gap: 12px; z-index: 100; box-shadow: 0 -2px 12px rgba(0,0,0,0.2);
        }
        .cart-bar .cart-icon { position: relative; font-size: 28px; cursor: pointer; }
        .cart-bar .cart-badge { position: absolute; top: -8px; right: -8px; background: var(--danger); color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .cart-bar .cart-info { flex: 1; cursor: pointer; }
        .cart-bar .cart-total { font-size: 18px; font-weight: 700; }
        .cart-bar .cart-total::before { content: '¥'; font-size: 13px; margin-right: 2px; }
        .cart-bar .cart-count-text { font-size: 12px; color: #AAAAAA; }
        .cart-bar .checkout-btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 24px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .cart-bar .checkout-btn:active { transform: scale(0.95); background: var(--primary-dark); }
        /* 模态框 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 500px; max-height: 80vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .modal-header h3 { font-size: 18px; font-weight: 700; }
        .close-btn { width: 30px; height: 30px; border-radius: 50%; border: none; background: #F0F0F0; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #666; }
        /* 购物车详情 */
        .cart-items-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .cart-item-row { display: flex; align-items: center; gap: 10px; padding: 10px; background: #FAFAFA; border-radius: 8px; }
        .cart-item-row .cart-item-name { flex: 1; font-weight: 500; }
        .cart-item-row .cart-item-price { color: var(--text-light); font-size: 13px; }
        .cart-item-row .quantity-control { gap: 4px; }
        .cart-item-row .quantity-btn { width: 24px; height: 24px; font-size: 14px; border-radius: 50%; }
        /* 表单 */
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; outline: none; transition: border 0.2s; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .submit-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .submit-btn:active { background: var(--primary-dark); transform: scale(0.98); }
        /* 支付模拟 */
        .pay-sim { text-align: center; padding: 10px 0; }
        .pay-sim .pay-icon { font-size: 60px; margin-bottom: 16px; }
        .pay-sim .pay-amount { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
        .pay-sim .pay-amount::before { content: '¥'; font-size: 18px; margin-right: 2px; }
        .pay-sim .pay-desc { color: var(--text-light); font-size: 14px; margin-bottom: 20px; }
        .pay-sim .pay-btn { width: 100%; padding: 14px; background: #07C160; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; }
        .pay-sim .pay-btn:active { background: #06AD56; transform: scale(0.98); }
        .pay-sim .cancel-pay { width: 100%; padding: 12px; background: #F0F0F0; color: #666; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
        /* Toast */
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 16px 24px; border-radius: 10px; font-size: 15px; z-index: 300; display: none; text-align: center; max-width: 80%; }
        /* 我的订单 */
        .my-orders { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .order-card { background: white; border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
        .order-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .order-id { font-weight: 700; font-size: 15px; }
        .order-status { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .order-status.pending { background: #FFF8E1; color: #F57F17; }
        .order-status.completed { background: #E8F5E9; color: #2E7D32; }
        .order-items { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 10px 0; margin-bottom: 10px; }
        .order-item-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
        .order-item-row .oi-name { color: var(--text); }
        .order-item-row .oi-qty { color: var(--text-light); margin: 0 8px; }
        .order-item-row .oi-price { font-weight: 500; }
        .order-total { text-align: right; font-weight: 700; font-size: 16px; color: var(--primary); margin-bottom: 10px; }
        .order-total::before { content: '合计：¥'; font-size: 13px; }
        .order-customer { font-size: 13px; color: var(--text-light); line-height: 1.6; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
        .empty-state .empty-emoji { font-size: 56px; margin-bottom: 12px; }
        /* 视图切换 */
        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <div class="navbar">
        <div class="brand"><span class="emoji">🥞</span><span>煎饼侠</span></div>
        <div style="display:flex; gap:6px;">
            <button class="nav-btn active" id="navMenu" onclick="showView('menu')">点餐</button>
            <button class="nav-btn" id="navOrders" onclick="showView('orders')">我的订单</button>
            <a class="nav-btn" href="./煎饼侠-商家订单管理.html" style="text-decoration:none;">商家端</a>
        </div>
    </div>

    <!-- 点餐视图 -->
    <div id="menuView" class="view active">
        <div class="category-bar" id="categoryBar"></div>
        <div class="menu-list" id="menuList"></div>
    </div>

    <!-- 我的订单视图 -->
    <div id="ordersView" class="view">
        <div class="my-orders" id="myOrdersContainer"></div>
    </div>

    <!-- 底部购物车栏 -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-icon" onclick="toggleCartDetail()">🛒<span class="cart-badge" id="cartBadge">0</span></div>
        <div class="cart-info" onclick="toggleCartDetail()">
            <div class="cart-total" id="cartTotal">0</div>
            <div class="cart-count-text" id="cartCountText">未选择商品</div>
        </div>
        <button class="checkout-btn" id="checkoutBtn" onclick="openCheckout()">去结算</button>
    </div>

    <!-- 购物车详情弹窗 -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-content">
            <div class="modal-header"><h3>已选商品</h3><button class="close-btn" onclick="closeModal('cartModal')">✕</button></div>
            <div class="cart-items-list" id="cartItemsList"></div>
            <button class="submit-btn" onclick="closeModal('cartModal'); openCheckout();">去结算</button>
        </div>
    </div>

    <!-- 结算弹窗 -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-content">
            <div class="modal-header"><h3>填写配送信息</h3><button class="close-btn" onclick="closeModal('checkoutModal')">✕</button></div>
            <div class="form-group"><label>宿舍楼栋 / 地址 *</label><input type="text" id="inputAddress" placeholder="例如：3号楼 501 室"></div>
            <div class="form-group"><label>联系人 *</label><input type="text" id="inputName" placeholder="姓名"></div>
            <div class="form-group"><label>手机号 *</label><input type="tel" id="inputPhone" placeholder="用于接收配送通知"></div>
            <div class="form-group"><label>备注（可选）</label><textarea id="inputNote" placeholder="口味要求、不要辣等"></textarea></div>
            <button class="submit-btn" onclick="goToPay()">提交订单并支付</button>
        </div>
    </div>

    <!-- 支付模拟弹窗 -->
    <div class="modal-overlay" id="payModal">
        <div class="modal-content">
            <div class="pay-sim">
                <div class="pay-icon">💚</div>
                <div class="pay-amount" id="payAmount">0</div>
                <div class="pay-desc">模拟微信支付 - 点击确认完成支付</div>
                <button class="pay-btn" onclick="confirmPay()">确认支付</button>
                <button class="cancel-pay" onclick="closeModal('payModal')">取消</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ==================== 数据 ====================
        const menuData = [
            { id: 1, name: '招牌煎饼', category: '煎饼', price: 8, emoji: '🥞', desc: '鸡蛋 + 薄脆 + 生菜 + 秘制酱' },
            { id: 2, name: '加蛋煎饼', category: '煎饼', price: 10, emoji: '🍳', desc: '双蛋 + 薄脆 + 生菜 + 秘制酱' },
            { id: 3, name: '火腿煎饼', category: '煎饼', price: 12, emoji: '🥓', desc: '火腿 + 鸡蛋 + 薄脆 + 生菜' },
            { id: 4, name: '牛肉煎饼', category: '煎饼', price: 15, emoji: '🥩', desc: '牛肉 + 鸡蛋 + 薄脆 + 生菜' },
            { id: 5, name: '加蛋', category: '加料', price: 2, emoji: '🥚', desc: '额外加一个鸡蛋' },
            { id: 6, name: '加火腿', category: '加料', price: 3, emoji: '🍖', desc: '额外加火腿' },
            { id: 7, name: '加芝士', category: '加料', price: 4, emoji: '🧀', desc: '额外加芝士片' },
            { id: 8, name: '加辣条', category: '加料', price: 2, emoji: '🌶️', desc: '额外加辣条' },
            { id: 9, name: '豆浆', category: '饮品', price: 3, emoji: '🥛', desc: '现磨热豆浆' },
            { id: 10, name: '可乐', category: '饮品', price: 4, emoji: '🥤', desc: '冰镇可乐' },
            { id: 11, name: '矿泉水', category: '饮品', price: 2, emoji: '💧', desc: '瓶装矿泉水' },
            { id: 12, name: '煎饼+豆浆套餐', category: '套餐', price: 10, emoji: '🥞🥛', desc: '招牌煎饼 + 豆浆（省1元）' },
            { id: 13, name: '煎饼+可乐套餐', category: '套餐', price: 12, emoji: '🥞🥤', desc: '招牌煎饼 + 可乐（省2元）' },
        ];

        const categories = ['全部', '煎饼', '加料', '饮品', '套餐'];
        let currentCategory = '全部';
        let cart = {}; // { itemId: quantity }
        let currentCustomerId = localStorage.getItem('jb_customerId') || generateCustomerId();

        function generateCustomerId() {
            // 生成一个随机但固定的顾客标识，模拟登录后的用户ID
            const id = 'C' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('jb_customerId', id);
            return id;
        }

        // 从 localStorage 读取所有订单
        function getAllOrders() {
            return JSON.parse(localStorage.getItem('jb_orders') || '[]');
        }

        // 保存所有订单
        function saveAllOrders(orders) {
            localStorage.setItem('jb_orders', JSON.stringify(orders));
        }

        // 获取当前顾客的订单（只显示自己的）
        function getMyOrders() {
            return getAllOrders().filter(order => order.customerId === currentCustomerId);
        }

        // 商家端在另一个标签页修改订单后，自动刷新当前顾客页面。
        window.addEventListener('storage', (event) => {
            if (event.key === 'jb_orders' && document.getElementById('ordersView').classList.contains('active')) {
                renderMyOrders();
            }
        });

        // ==================== 工具函数 ====================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        function closeModal(id) { document.getElementById(id).classList.remove('show'); }
        function openModal(id) { document.getElementById(id).classList.add('show'); }

        function formatMoney(num) { return num.toFixed(2); }
        function getCartCount() { return Object.values(cart).reduce((sum, qty) => sum + qty, 0); }
        function getCartTotal() {
            let total = 0;
            for (const [itemId, qty] of Object.entries(cart)) {
                const item = menuData.find(i => i.id === parseInt(itemId));
                if (item) total += item.price * qty;
            }
            return total;
        }

        // 视图切换（点餐 / 我的订单）
        function showView(view) {
            document.getElementById('menuView').classList.toggle('active', view === 'menu');
            document.getElementById('ordersView').classList.toggle('active', view === 'orders');
            document.getElementById('navMenu').classList.toggle('active', view === 'menu');
            document.getElementById('navOrders').classList.toggle('active', view === 'orders');
            document.getElementById('cartBar').style.display = view === 'menu' ? 'flex' : 'none';
            if (view === 'orders') renderMyOrders();
        }

        // ==================== 渲染分类 ====================
        function renderCategories() {
            const container = document.getElementById('categoryBar');
            container.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-btn' + (cat === currentCategory ? ' active' : '');
                btn.textContent = cat;
                btn.onclick = () => { currentCategory = cat; renderCategories(); renderMenu(); };
                container.appendChild(btn);
            });
        }

        // ==================== 渲染菜单 ====================
        function renderMenu() {
            const container = document.getElementById('menuList');
            container.innerHTML = '';
            const filtered = currentCategory === '全部' ? menuData : menuData.filter(i => i.category === currentCategory);
            filtered.forEach(item => {
                const qty = cart[item.id] || 0;
                const div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = `
                    <div class="item-emoji">${item.emoji}</div>
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-desc">${item.desc}</div>
                        <div class="item-price">${item.price}</div>
                    </div>
                    <div class="quantity-control">
                        <button class="quantity-btn minus" data-id="${item.id}">−</button>
                        <span class="quantity-num">${qty}</span>
                        <button class="quantity-btn plus" data-id="${item.id}">＋</button>
                    </div>
                `;
                container.appendChild(div);
                div.querySelector('.plus').addEventListener('click', () => changeQty(item.id, 1));
                div.querySelector('.minus').addEventListener('click', () => changeQty(item.id, -1));
            });
        }

        // 购物车数量变动
        function changeQty(itemId, delta) {
            if (!cart[itemId]) cart[itemId] = 0;
            const newQty = cart[itemId] + delta;
            if (newQty <= 0) delete cart[itemId]; else cart[itemId] = newQty;
            updateCartUI();
            renderMenu();
        }

        // 更新购物车UI
        function updateCartUI() {
            const count = getCartCount();
            const total = getCartTotal();
            document.getElementById('cartTotal').textContent = formatMoney(total);
            document.getElementById('cartCountText').textContent = count > 0 ? `已选 ${count} 件商品` : '未选择商品';
            const badge = document.getElementById('cartBadge');
            badge.textContent = count;
            badge.style.display = count > 0 ? 'flex' : 'none';
            document.getElementById('checkoutBtn').disabled = count === 0;
            document.getElementById('checkoutBtn').style.opacity = count === 0 ? '0.5' : '1';
        }

        // 购物车详情弹窗
        function toggleCartDetail() {
            if (getCartCount() === 0) { showToast('购物车是空的，快选点好吃的吧 🥞'); return; }
            renderCartDetail();
            openModal('cartModal');
        }

        function renderCartDetail() {
            const container = document.getElementById('cartItemsList');
            container.innerHTML = '';
            for (const [itemId, qty] of Object.entries(cart)) {
                const item = menuData.find(i => i.id === parseInt(itemId));
                if (!item) continue;
                const row = document.createElement('div');
                row.className = 'cart-item-row';
                row.innerHTML = `
                    <span style="font-size:24px;">${item.emoji}</span>
                    <span class="cart-item-name">${item.name}</span>
                    <span class="cart-item-price">¥${item.price}</span>
                    <div class="quantity-control">
                        <button class="quantity-btn minus" data-id="${item.id}" style="width:24px;height:24px;font-size:14px;">−</button>
                        <span class="quantity-num">${qty}</span>
                        <button class="quantity-btn plus" data-id="${item.id}" style="width:24px;height:24px;font-size:14px;">＋</button>
                    </div>
                `;
                container.appendChild(row);
                row.querySelector('.plus').addEventListener('click', () => { changeQty(item.id, 1); renderCartDetail(); });
                row.querySelector('.minus').addEventListener('click', () => { changeQty(item.id, -1); renderCartDetail(); if (getCartCount() === 0) closeModal('cartModal'); });
            }
        }

        // ==================== 结算流程 ====================
        function openCheckout() {
            if (getCartCount() === 0) { showToast('请先选择商品'); return; }
            openModal('checkoutModal');
        }

        function goToPay() {
            const address = document.getElementById('inputAddress').value.trim();
            const name = document.getElementById('inputName').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            if (!address || !name || !phone) { showToast('请完整填写配送信息'); return; }
            document.getElementById('payAmount').textContent = formatMoney(getCartTotal());
            closeModal('checkoutModal');
            openModal('payModal');
        }

        function confirmPay() {
            const address = document.getElementById('inputAddress').value.trim();
            const name = document.getElementById('inputName').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const note = document.getElementById('inputNote').value.trim();

            const order = {
                id: 'JB' + Date.now().toString().slice(-8),
                customerId: currentCustomerId,   // 关键：关联顾客ID
                createTime: new Date().toLocaleString('zh-CN', { hour12: false }),
                items: Object.entries(cart).map(([itemId, qty]) => {
                    const item = menuData.find(i => i.id === parseInt(itemId));
                    return { name: item.name, price: item.price, qty: parseInt(qty) };
                }),
                total: getCartTotal(),
                customer: { name, phone, address, note },
                status: 'pending'
            };

            const allOrders = getAllOrders();
            allOrders.unshift(order);
            saveAllOrders(allOrders);

            // 清空购物车和表单
            cart = {};
            updateCartUI();
            renderMenu();
            document.getElementById('inputAddress').value = '';
            document.getElementById('inputName').value = '';
            document.getElementById('inputPhone').value = '';
            document.getElementById('inputNote').value = '';

            closeModal('payModal');
            showToast('✅ 支付成功！');
            showView('orders'); // 跳转到我的订单
        }

        // ==================== 我的订单 ====================
        function renderMyOrders() {
            const container = document.getElementById('myOrdersContainer');
            const myOrders = getMyOrders();
            if (myOrders.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-emoji">📋</div><p>暂无订单</p><p style="font-size:13px;margin-top:4px;">下单后会显示在这里</p></div>`;
                return;
            }
            container.innerHTML = '';
            myOrders.forEach(order => {
                const card = document.createElement('div');
                card.className = 'order-card';
                const itemsHtml = order.items.map(item => `
                    <div class="order-item-row">
                        <span class="oi-name">${item.name}</span>
                        <span class="oi-qty">x${item.qty}</span>
                        <span class="oi-price">¥${(item.price * item.qty).toFixed(2)}</span>
                    </div>
                `).join('');
                card.innerHTML = `
                    <div class="order-header">
                        <span class="order-id">#${order.id}</span>
                        <span class="order-status ${order.status}">${order.status === 'pending' ? '待配送' : '已完成'}</span>
                    </div>
                    <div class="order-items">${itemsHtml}</div>
                    <div class="order-total">${order.total.toFixed(2)}</div>
                    <div class="order-customer">🕐 ${order.createTime}<br>📍 ${order.customer.address}</div>
                `;
                container.appendChild(card);
            });
        }

        // ==================== 初始化 ====================
        function init() {
            renderCategories();
            renderMenu();
            updateCartUI();
            showView('menu');
        }
        init();
    </script>
</body>
</html>
