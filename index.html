<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>煎饼侠点餐系统 Demo</title>
    <style>
        :root { --primary: #ff7e36; --text: #333; --muted: #888; --bg: #fff8f2; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
        main { width: min(440px, 100%); text-align: center; }
        .logo { font-size: 56px; margin-bottom: 12px; }
        h1 { margin: 0 0 10px; font-size: 28px; }
        p { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
        .links { display: grid; gap: 12px; }
        a { display: block; padding: 15px 18px; border-radius: 12px; background: var(--primary); color: white; font-weight: 700; text-decoration: none; box-shadow: 0 4px 12px rgba(255, 126, 54, .22); }
        a.secondary { background: white; color: var(--primary); border: 1px solid #ffd0b8; box-shadow: none; }
        .tip { margin-top: 24px; font-size: 13px; color: var(--muted); }
    </style>
</head>
<body>
    <main>
        <div class="logo">🥞</div>
        <h1>煎饼侠点餐系统</h1>
        <p>HTML Demo｜顾客端与商家端使用同一浏览器数据演示</p>
        <div class="links">
            <a href="./煎饼侠-点餐.html">进入顾客端点餐</a>
            <a class="secondary" href="./煎饼侠-商家订单管理.html">进入商家订单管理</a>
        </div>
        <div class="tip">商家端演示密码：8888</div>
    </main>
</body>
</html>
